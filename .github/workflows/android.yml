# SPDX-License-Identifier: GPL-3.0-or-later
name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # AGP installs the pinned NDK/CMake versions automatically once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew test --console=plain

      # The release build is unsigned here; building it checks that R8 (minify) still works.
      - name: Build debug APK and unsigned release
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: selfband-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Pushing a tag v<versionName> builds the signed release and opens a draft GitHub release.
  # Signing secrets: see docs/RELEASING.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SELFBAND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SELFBAND_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and app bundle
        env:
          SELFBAND_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SELFBAND_KEYSTORE_PASSWORD: ${{ secrets.SELFBAND_KEYSTORE_PASSWORD }}
          SELFBAND_KEY_ALIAS: ${{ secrets.SELFBAND_KEY_ALIAS }}
          SELFBAND_KEY_PASSWORD: ${{ secrets.SELFBAND_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --console=plain

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/selfband-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/selfband-$VERSION.aab"
          (cd dist && sha256sum selfband-* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: selfband-${{ env.VERSION }}-release
          path: dist/*
          if-no-files-found: error

      # A draft: nothing is public until the owner reviews and publishes it on GitHub.
      # The .aab is for the Play Console and stays in the workflow artifact only.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Selfband $VERSION" --generate-notes \
            "dist/selfband-$VERSION.apk" dist/SHA256SUMS
